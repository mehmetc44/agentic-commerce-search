# ============================================================
# AgenticCommerce — Agent Konfigürasyonu
# ============================================================
# Bu dosya tüm agent ve node'ların model, parametre ve
# davranış ayarlarını merkezi olarak yönetir.
# Değer öncelik sırası: env (.env) > bu dosya > kod içi default
# ============================================================

# ------------------------------------------------------------
# Supervisor (Router Node)
# Görev: Kullanıcı niyetini tespit et, doğru node'a yönlendir.
# Beklenen output: {"intent": "product_search", "confidence": 0.97}
# ------------------------------------------------------------
supervisor:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.0           # Routing deterministik olmalı
  max_tokens: 128            # Sadece intent JSON dönecek, uzun cevap gereksiz
  timeout_seconds: 10

  # Tanımlı intent kategorileri (conditional edge'ler bunlara göre çalışır)
  intents:
    - product_search
    - product_compare
    - product_review
    - web_research
    - clarification_needed
    - general_chat

# ------------------------------------------------------------
# Search Agent (ReAct Loop)
# Görev: Kategori bul → ürün ara → sonuç döndür
# Tool'lar: get_closest_categories, list_closest_products
# ------------------------------------------------------------
search_agent:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.2
  max_tokens: 1024
  max_iterations: 6          # ReAct loop'u en fazla 6 adım
  timeout_seconds: 45

# ------------------------------------------------------------
# Web Research Agent (ReAct Loop)
# Görev: Kullanıcı sorgusunu web'den zenginleştir
# Tool'lar: web_search
# ------------------------------------------------------------
web_research_agent:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 512
  max_iterations: 4
  timeout_seconds: 30

# ------------------------------------------------------------
# Review Node (Basit LLM Chain — ReAct değil)
# Görev: Ürün yorumlarını özetle, olumlu/olumsuz analiz yap
# ------------------------------------------------------------
review_node:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 800
  max_reviews_to_process: 20   # DB'den kaç yorum çekileceği

# ------------------------------------------------------------
# Compare Node (Basit LLM Chain — ReAct değil)
# Görev: İki ürünü karşılaştır, tablo şeklinde sun
# ------------------------------------------------------------
compare_node:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.2
  max_tokens: 1024

# ------------------------------------------------------------
# Clarification Node (Basit LLM Chain — ReAct değil)
# Görev: Muğlak sorguları netleştirmek için soru sor
# ------------------------------------------------------------
clarification_node:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.5            # Biraz daha yaratıcı sorular
  max_tokens: 256
  max_clarification_turns: 2  # Kaç tur soru sorabilir

# ------------------------------------------------------------
# Response Builder (Basit LLM Chain — ReAct değil)
# Görev: Tüm node sonuçlarını topla, kullanıcıya sun
# ------------------------------------------------------------
response_builder:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.4
  max_tokens: 1500

# ------------------------------------------------------------
# Embedding Service
# Görev: Metinden vektör üret (get_closest_categories tool'u kullanır)
# ------------------------------------------------------------
embedding:
  model: all-MiniLM-L6-v2    # sentence-transformers modeli
  vector_dimension: 384
  device: cpu                  # cpu | cuda | mps

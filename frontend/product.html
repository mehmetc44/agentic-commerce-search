<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css?v=2">
    <title>Product Details - E-Commerce</title>
</head>
<body class="bg-light">
    
    <header>
        <section class="top-bar">
            <div class="container">
                <div class="row gy-2 align-items-center">
                    <div class="col-lg-2 col-sm-4 col-4">
                        <a href="index.html" class="navbar-brand"><i class="fa-solid fa-truck-fast"></i> E-Commerce</a>
                    </div>
                   
                    <div class="col-lg-5 col-sm-8 col-8 order-lg-last">
                        <div class="text-end">
                            <a href="#" class="btn btn-light">
                                <i class="fa fa-user"></i> <span class="ms-1 d-none d-sm-inline-block">Hesabım</span>
                            </a>
                            <a href="#" class="btn btn-light">
                                <i class="fa fa-heart"></i> <span class="ms-1 d-none d-sm-inline-block">Favorilerim</span>
                            </a>
                            <a href="#" class="btn btn-light">
                                <i class="fa fa-shopping-cart"></i> <span class="ms-1 d-none d-sm-inline-block">Sepetim</span>
                            </a>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="input-group">
                            <input type="text" id="searchInput" placeholder="Ne aramıştınız?" class="form-control">
                            <button onclick="search()" class="btn btn-primary"><i class="fa fa-search"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="bg-primary p-3">
            <div class="container">
                <nav>
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="index.html" class="text-white">Anasayfa</a></li>
                        <li class="breadcrumb-item"><a href="#" id="breadcrumbCategory" class="text-white">Kategori</a></li>
                        <li class="breadcrumb-item active text-white-50" id="breadcrumbTitle" aria-current="page">Ürün Adı</li>
                    </ol>
                </nav>
            </div>
        </section>
    </header>

    <section class="mt-4">
        <div class="container">
            <div class="row bg-white p-4 rounded shadow-sm">
                <!-- Sol Taraf: Görsel Slider -->
                <div class="col-lg-5 mb-4 mb-lg-0">
                    <div class="gallery-wrap">
                        <div class="img-big-wrap border rounded d-flex align-items-center justify-content-center" style="height: 500px; position: relative;">
                            
                            <!-- Bootstrap Carousel for Images -->
                            <div id="productCarousel" class="carousel slide" data-bs-ride="carousel" style="width: 100%; height: 100%;">
                                <div class="carousel-inner h-100" id="carouselInner">
                                    <div class="carousel-item active h-100 d-flex align-items-center justify-content-center">
                                        <div class="spinner-border text-primary" role="status"></div>
                                    </div>
                                </div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev" style="filter: invert(100%);">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Önceki</span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next" style="filter: invert(100%);">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Sonraki</span>
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
                
                <!-- Sağ Taraf: Ürün Bilgileri -->
                <div class="col-lg-7">
                    <article>
                        <h4 class="title text-dark fw-bold mb-2" id="productTitle">Ürün Yükleniyor...</h4>
                        <div class="rating-wrap d-flex align-items-center mb-3 pb-3 border-bottom">
                            <span id="ratingStars"></span>
                            <span class="ms-2 fw-bold" id="ratingScoreText"></span>
                            <a href="#reviewsSection" class="ms-2 text-primary text-decoration-underline" id="ratingCount"></a>
                        </div>
                        
                        <div class="mb-4">
                            <b class="price text-danger" style="font-size: 2rem;" id="productPrice">0.00 ₺</b>
                        </div>
                        
                        <p class="text-success fw-bold"><i class="fa-solid fa-check-circle me-1"></i> Stokta Var</p>
                        
                        <div class="buttons mt-4 d-flex gap-3">
                            <button class="btn btn-warning btn-lg fw-bold flex-grow-1">
                                Sepete Ekle
                            </button>
                            <button class="btn btn-outline-secondary btn-lg">
                                <i class="fa-regular fa-heart"></i>
                            </button>
                        </div>
                        
                        <div class="mt-5">
                            <h5 class="fw-bold mb-3">Ürün Özellikleri</h5>
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered text-sm" id="attributesTable">
                                    <tbody>
                                        <tr><td colspan="2" class="text-muted">Yükleniyor...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
            
            <!-- Değerlendirmeler Bölümü (Trendyol Stili) -->
            <div class="row mt-4 mb-5" id="reviewsSection">
                <div class="col-12">
                    <div class="bg-white p-4 rounded shadow-sm">
                        <h4 class="fw-bold mb-4">Ürün Değerlendirmeleri</h4>
                        <div id="reviewsContainer">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status"></div>
                                <div class="mt-2 text-muted">Değerlendirmeler yükleniyor...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </section>

    <footer class="mt-5 py-4 bg-primary text-white">
        <div class="container">
            <div class="row gy-3">
                <div class="col-md-6 col-lg-4">
                    <form>
                        <div class="input-group">
                            <input type="email" class="form-control" placeholder="E-posta adresiniz">
                            <button type="button" class="btn btn-outline-warning text-white">Abone Ol</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-6 col-lg-8 text-center text-md-end">
                    <nav>
                        <a href="#" class="btn btn-icon btn-outline-warning m-1"><i class="fab fa-facebook"></i></a>
                        <a href="#" class="btn btn-icon btn-outline-warning m-1"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="btn btn-icon btn-outline-warning m-1"><i class="fab fa-youtube"></i></a>
                        <a href="#" class="btn btn-icon btn-outline-warning m-1"><i class="fab fa-twitter"></i></a>
                    </nav>
                </div>
                <div class="col-12 text-center text-md-start">
                    <p class="mb-0">© 2026 Tüm hakları saklıdır.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="/js/fslightbox.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="js/product.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css?v=2">
    <title>E-Commerce</title>
</head>

<body class="bg-light">

    <header>
        <section class="top-bar">
            <div class="container">
                <div class="row gy-2 align-items-center">
                    <div class="col-lg-2 col-sm-4 col-4">
                        <a href="index.html" class="navbar-brand"><i class="fa-solid fa-truck-fast"></i> E-Commerce</a>
                    </div>

                    <div class="col-lg-5 col-sm-8 col-8 order-lg-last">
                        <div class="text-end d-flex justify-content-end gap-2 align-items-center">
                            <button class="btn btn-warning shadow-sm fw-bold" type="button" data-bs-toggle="offcanvas" data-bs-target="#aiPanel">
                                <i class="fa fa-microchip"></i> <span class="d-none d-sm-inline-block">Yapay Zeka Paneli</span>
                            </button>
                            <a href="#" class="btn btn-light">
                                <i class="fa fa-user"></i> <span class="ms-1 d-none d-sm-inline-block">Hesabım</span>
                            </a>
                            <a href="#" class="btn btn-light">
                                <i class="fa fa-heart"></i> <span class="ms-1 d-none d-sm-inline-block">Favorilerim</span>
                            </a>
                            <a href="shopping-cart.html" class="btn btn-light">
                                <i class="fa fa-shopping-cart"></i> <span
                                    class="ms-1 d-none d-sm-inline-block">Sepetim</span>
                            </a>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="input-group">
                            <input type="text" id="searchInput" placeholder="Ne aramıştınız?" class="form-control">
                            <button onclick="search()" class="btn btn-primary">
                                <i class="fa fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <nav class="navbar navbar-dark bg-primary navbar-expand-lg">
            <div class="container">
                <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                    <ul class="navbar-nav" id="mainCategoryNav">
                        <!-- Main categories will be populated by app.js -->
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section class="mt-3" id="heroSection">
        <div class="container">
            <div class="card">
                <div class="row p-1 p-lg-2 gx-2">
                    <div class="col-lg-8 offset-lg-2">
                        <!-- slider -->
                        <div id="slider" class="carousel slide" data-bs-ride="carousel">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#slider" data-bs-slide-to="0"
                                    class="active"></button>
                                <button type="button" data-bs-target="#slider" data-bs-slide-to="1"></button>
                                <button type="button" data-bs-target="#slider" data-bs-slide-to="2"></button>
                            </div>
                            <div class="carousel-inner">
                                <div class="carousel-item active">
                                    <img src="/img/slider-1.png" alt="slider 1" class="d-block w-100">
                                </div>
                                <div class="carousel-item">
                                    <img src="/img/slider-2.png" alt="slider 2" class="d-block w-100">
                                </div>
                                <div class="carousel-item">
                                    <img src="/img/slider-3.png" alt="slider 3" class="d-block w-100">
                                </div>
                            </div>
                            <button type="button" class="carousel-control-prev" data-bs-target="#slider"
                                data-bs-slide="prev">
                                <span class="carousel-control-prev-icon"></span>
                            </button>
                            <button type="button" class="carousel-control-next" data-bs-target="#slider"
                                data-bs-slide="next">
                                <span class="carousel-control-next-icon"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>



    <section class="mt-3">
        <div class="container">
            <h3 class="h4 mb-1 mb-lg-3" id="sectionTitle">Recently Added</h3>

            <div id="results" class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
                
                
            </div>
        </div>
    </section>

    <footer class="mt-3 py-4 bg-primary">
        <div class="container">
            <div class="row gy-3">
                <div class="col-md-6 col-lg-4">
                    <form>
                        <div class="input-group">
                            <input type="email" class="form-control" placeholder="E-posta adresiniz">
                            <button type="button" class="btn btn-outline-warning">Abone Ol</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-6 col-lg-8">
                    <nav class="text-center text-md-end">
                        <a href="#" class="btn btn-icon btn-outline-warning">
                            <i class="fab fa-facebook"></i>
                        </a>
                        <a href="#" class="btn btn-icon btn-outline-warning">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="#" class="btn btn-icon btn-outline-warning">
                            <i class="fab fa-youtube"></i>
                        </a>
                        <a href="#" class="btn btn-icon btn-outline-warning">
                            <i class="fab fa-twitter"></i>
                        </a>
                    </nav>
                </div>
                <div class="col-12">
                    <p class="text-center text-md-start text-white">
                        © 2026 Tüm hakları saklıdır.
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <!-- AI Chat Panel -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="aiPanel" aria-labelledby="aiPanelLabel" style="width: 400px;">
        <div class="offcanvas-header bg-light border-bottom">
            <h5 class="offcanvas-title text-dark fw-bold d-flex align-items-center" id="aiPanelLabel">
                <i class="fa-solid fa-sparkles text-primary me-2"></i> Alışveriş Asistanı
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Kapat"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column bg-white p-0">
            <!-- Chat Messages Area -->
            <div id="chatMessages" class="flex-grow-1 p-3" style="overflow-y: auto; background-color: #f9fbfc;">
                <div class="d-flex mb-3">
                    <div class="bg-primary text-white p-2 rounded shadow-sm" style="max-width: 80%; border-radius: 15px 15px 15px 0 !important;">
                        Merhaba! Ben sizin yapay zeka destekli alışveriş asistanınızım. Size nasıl yardımcı olabilirim? (Şu an deneme aşamasındayım)
                    </div>
                </div>
            </div>
            
            <!-- Chat Input Area -->
            <div class="border-top p-3 bg-light">
                <div class="input-group">
                    <input type="text" id="chatInput" class="form-control rounded-pill me-2" placeholder="Mesajınızı yazın..." style="border: 1px solid #dee2e6;">
                    <button class="btn btn-primary rounded-circle" id="chatSendBtn" style="width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js?v=2"></script>
    <script src="js/search.js?v=3"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenticCommerce - Intent Analyzer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <h1 class="gradient-text"><i class="fa-solid fa-bullseye"></i> Intent Analyzer Agent Router</h1>
            <p class="subtitle">E-Commerce Intent Classification & Routing Flow</p>
        </header>

        <!-- Chat Area -->
        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <!-- Initial Assistant Message -->
                <div class="message assistant">
                    <div class="message-avatar">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="message-content">
                        <p>Merhaba! Ben Intent Analyzer yönlendirme asistanınız. Arama, tavsiye veya sohbet mesajlarınızı yazabilirsiniz.</p>
                    </div>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="chat-input-area">
            <form id="chatForm" class="input-form">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Mesajınızı yazın (Örn: 'Siyah bir telefon kılıfı arıyorum' veya 'Merhaba')..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" id="sendBtn" class="send-button">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </footer>
    </div>

    <!-- Custom JS -->
    <script src="js/app.js"></script>
</body>
</html>
